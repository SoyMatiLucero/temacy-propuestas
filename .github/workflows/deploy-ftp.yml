# Publica propuestas.temacy.com: en cada push a main sube el repo por FTP a Hostinger.
# La cuenta FTP ya tiene como raíz public_html/propuestas, por eso server-dir es ./
name: Deploy por FTP a propuestas.temacy.com

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ftp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el repo
        uses: actions/checkout@v4

      - name: Subir por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
